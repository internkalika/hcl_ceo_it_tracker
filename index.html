<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d71920">
<meta name="robots" content="noindex">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("hero-theme")==="dark"?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<title>IT Project Tracker - Hero Cycles</title>
<style>
/* Hero design tokens (same values as src/app/globals.css) */
:root{
  --red:#d71920;--red-dark:#b5141a;--red-tint:#fdecec;
  --ink:#292d32;--ink-soft:#5a6169;--grey:#f4f5f6;--line:#e1e4e8;--page:#f4f5f6;--surface:#fff;--wk:#fafafa;--hover2:#e9ebee;--red-ink:#d71920;--kpi-neutral:#292d32;
  --info-tint:#eaf2fc;--info-ink:#1c5fae;--mint-tint:#e6f6ef;--mint-ink:#12795a;--orange-tint:#fdeee7;--orange-ink:#b2431c;--amber-ink:#8a5a00;
  --ok:#198754;--ok-tint:#e8f5ee;--warn:#d98b12;--warn-tint:#fdf3e1;--err:#c62828;--err-tint:#fbeaea;
  --shadow:0 1px 2px rgb(41 45 50/.06),0 1px 3px rgb(41 45 50/.04);
  --shadow-md:0 4px 10px rgb(41 45 50/.10);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html{color-scheme:light}
html[data-theme=dark]{color-scheme:dark;
  --ink:#e7e9ec;--ink-soft:#a3abb4;--grey:#222830;--line:#2e353d;--page:#0e1114;--surface:#171b20;--wk:#1b2026;--hover2:#2c333b;
  --red-ink:#f0626a;--kpi-neutral:#aab2bb;--red-tint:#3b1a1d;--ok:#3cb27c;--ok-tint:#112e22;--warn:#e8a02a;--warn-tint:#382b10;--err:#ef6b6b;--err-tint:#3a1b1d;
  --info-tint:#15283d;--info-ink:#8fbaf0;--mint-tint:#11302a;--mint-ink:#5fd0a6;--orange-tint:#38221a;--orange-ink:#f4a07c;--amber-ink:#f0c36d;
  --shadow:0 1px 2px rgb(0 0 0/.5),0 1px 3px rgb(0 0 0/.3);--shadow-md:0 4px 12px rgb(0 0 0/.5)}
*{box-sizing:border-box}
html{scroll-padding-top:5rem}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--page);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1,h2,h3,p,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-soft)}.xs{font-size:.75rem;line-height:1.2rem}.sm{font-size:.875rem}.fw{font-weight:600}.err{color:var(--err)}.tnum{font-variant-numeric:tabular-nums}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.skip{position:absolute;left:8px;top:-60px;z-index:60;background:var(--surface);padding:8px 12px;border-radius:6px;box-shadow:var(--shadow-md)}
.skip:focus{top:8px}

/* header */
header.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--red)}
.top-in{display:flex;align-items:center;gap:12px;height:64px;padding:0 24px}
.burger{display:none;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--ink);font-size:24px}
.burger:hover{background:var(--grey)}
.logo{display:flex;align-items:center;flex:none}
.logo img{height:40px;width:auto;max-width:160px;object-fit:contain;display:block;background:#fff;border-radius:4px}
.logo b{font-size:1rem}
.brand{border-left:1px solid var(--line);padding-left:16px;min-width:0}
.brand .name{font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-line{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--ink-soft);min-width:0}
.status-line i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.status-line span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.today{text-align:right;font-size:.75rem;line-height:1.2;color:var(--ink-soft)}
.today b{display:block;font-weight:600;color:var(--ink)}
.status-mobile{display:none;border-top:1px solid var(--line);padding:6px 16px}

/* layout */
.shell{display:flex;flex:1}
aside.side{display:block;width:240px;flex:none;background:var(--surface);border-right:1px solid var(--line)}
aside.side nav{position:sticky;top:68px;padding:16px;max-height:calc(100vh - 68px);overflow:auto}
.menu-label{padding:0 12px;margin-bottom:8px;font-size:.6875rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.nav li+li{margin-top:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-size:.875rem;font-weight:500}
.nav a:hover{background:var(--grey)}
.nav a[aria-current=page]{background:var(--red);color:#fff}
.nav .ic{font-size:18px}
main{flex:1;min-width:0}
.wrap{max-width:1520px;margin:0 auto;padding:32px}
footer.foot{border-top:1px solid var(--line);background:var(--surface);padding:16px;text-align:center;font-size:.875rem;color:var(--ink-soft)}
footer.foot a{color:var(--red-ink);font-weight:600;text-decoration:underline;text-underline-offset:2px}
footer.foot .snap{margin-top:4px;font-size:.75rem}
.drawer{display:none;position:fixed;inset:0;z-index:50}
.drawer.open{display:block}
.drawer .shade{position:absolute;inset:0;background:rgb(41 45 50/.4);border:0;width:100%}
.drawer nav{position:absolute;top:0;bottom:0;left:0;width:288px;max-width:85vw;background:var(--surface);padding:12px;overflow:auto;box-shadow:0 10px 30px rgb(0 0 0/.25)}
@media(max-width:1023px){
  aside.side{display:none}.burger{display:block}.wrap{padding:24px 16px}.top-in{padding:0 16px}
}
@media(max-width:639px){.brand,.today{display:none}.status-mobile{display:block}}
@media(min-width:640px){.status-mobile{display:none!important}}
@media(max-width:767px){.today{display:none}}

/* page header, cards */
.ph{margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}
.ph>div:first-child{flex:1 1 320px;min-width:0}
.ph h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.ph p{margin-top:4px;max-width:48rem;font-size:.875rem;color:var(--ink-soft)}
.stack>*+*{margin-top:24px}
.stack-s>*+*{margin-top:16px}
.stack>.ph,.stack-s>.ph{margin-bottom:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:.875rem;font-weight:600;display:flex;align-items:center;gap:8px}
.card-h .sub{margin-top:2px;font-size:.75rem;color:var(--ink-soft)}
.card-h .more{display:inline-flex;align-items:center;gap:4px;padding:4px 6px;border-radius:6px;font-size:.75rem;font-weight:600;color:var(--red-ink);white-space:nowrap}
.card-h .more:hover{background:var(--red-tint)}
.card-b{padding:16px}
.count{border-radius:999px;background:var(--grey);padding:2px 8px;font-size:.75rem;font-weight:500;color:var(--ink-soft)}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:24px;align-items:stretch}
.grid5>.c2{grid-column:span 2}.grid5>.c3{grid-column:span 3}
@media(max-width:1279px){.grid5{grid-template-columns:1fr}.grid5>.c2,.grid5>.c3{grid-column:auto}}

/* KPI cards */
.kpis{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:768px){.kpis.k5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1360px){.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(min-width:1280px){.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{position:relative;display:flex;flex-direction:column;height:100%;overflow:hidden;padding:16px 16px 16px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.kpis>li{min-width:0}
.kpi .edge{position:absolute;left:0;top:0;bottom:0;width:6px}
.kpi .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kpi .lab{font-size:.875rem;font-weight:500;color:var(--ink-soft)}
.kpi .ico{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;font-size:20px;flex:none}
.kpi .val{margin-top:4px;font-size:2.25rem;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .val.txt{margin-top:8px;font-size:1.25rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .hint{margin-top:8px;display:flex;justify-content:space-between;gap:8px;font-size:.75rem;line-height:1.3;color:var(--ink-soft)}
.kpi .hint .ic{opacity:0;transition:opacity .15s;font-size:16px}
.kpi:hover .hint .ic{opacity:1}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;border:1px solid;border-radius:999px;padding:0 8px;font-size:.75rem;font-weight:500;line-height:20px}
.badge .ic{font-size:14px}
.b-completed{background:var(--ok-tint);color:var(--ok);border-color:rgb(25 135 84/.3)}
.b-in_progress{background:var(--info-tint);color:var(--info-ink);border-color:rgb(42 120 214/.3)}
.b-working{background:var(--mint-tint);color:var(--mint-ink);border-color:rgb(27 175 122/.3)}
.b-delayed,.b-overdue{background:var(--err-tint);color:var(--err);border-color:rgb(198 40 40/.3)}
.b-on_hold,.b-at_risk,.b-due_soon{background:var(--warn-tint);color:var(--amber-ink);border-color:rgb(217 139 18/.4)}
.b-not_started{background:var(--orange-tint);color:var(--orange-ink);border-color:rgb(235 104 52/.3)}
.b-unmapped,.b-unknown{background:var(--surface);color:var(--ink-soft);border-color:rgb(90 97 105/.5);border-style:dashed}
.b-on_track{background:var(--ok-tint);color:var(--ok);border-color:rgb(25 135 84/.3)}
.b-not_applicable{background:var(--surface);color:var(--ink-soft);border-color:var(--line)}
.tag{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--grey);color:var(--ink-soft);border-radius:6px;padding:2px 6px;font-size:.75rem;font-weight:500}
.tag.warn{border-color:rgb(217 139 18/.4);background:var(--warn-tint);color:var(--amber-ink)}

/* project cards: the whole card is one link (title link stretched over it) */
.cards{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1280px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cards>li{height:100%}
.pcard{position:relative;display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:rgb(90 97 105/.4)}
.pcard:has(a:focus-visible),.mini:has(a:focus-visible){box-shadow:0 0 0 2px var(--red)}
.pcard .edge{position:absolute;left:0;top:0;bottom:0;width:6px}
.pc-body{display:flex;flex-direction:column;flex:1;gap:16px;padding:20px 20px 20px 28px}
.pc-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 12px}
.pc-head h2{flex:1;min-width:0;font-size:1.125rem;font-weight:700;line-height:1.35}
.pc-status{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.stretch{outline:none}
.stretch::after{content:"";position:absolute;inset:0}
.pcard:hover .stretch,.mini:hover .stretch{color:var(--red-ink)}
.pc-obj{font-size:.875rem;color:var(--ink-soft)}
.clamp2,.clamp3{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.clamp2{-webkit-line-clamp:2}.clamp3{-webkit-line-clamp:3}
.pc-update{background:var(--grey);border-radius:8px;padding:10px 12px}
.pc-update .t{margin-top:4px;font-size:.875rem}
.pc-facts{display:grid;gap:12px 16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:640px){.pc-facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pc-facts dt{display:flex;align-items:center;gap:6px;font-size:.75rem;font-weight:500;color:var(--ink-soft)}
.pc-facts dt .ic{font-size:14px}
.pc-facts dd{margin-top:4px;font-size:.875rem}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.pc-foot{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.pc-foot .go{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:.875rem;font-weight:600;color:var(--red-ink)}
.pc-foot .go .ic{font-size:16px;transition:transform .15s}
.pcard:hover .go .ic{transform:translateX(2px)}
.mini{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px 14px;transition:border-color .15s,box-shadow .15s}
.mini:hover{border-color:rgb(90 97 105/.4);box-shadow:var(--shadow)}
.mini .r1{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:4px 12px}
.mini h3{font-size:.875rem;font-weight:600;min-width:0}
.mini p{margin-top:6px;font-size:.875rem;color:var(--ink-soft)}
.minis{padding:12px}.minis>li+li{margin-top:12px}

/* filter form */
.flt{padding:8px 10px}
.flt>*+*{margin-top:8px}
.flt form>*+*{margin-top:8px}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.frow .fs1{flex:1 1 130px;min-width:0}.frow .fs1.srt{flex:1.4 1 175px}.frow .fsr{position:relative;flex:2 1 220px;min-width:0}
.flt input,.flt select{height:32px;padding:4px 8px;font-size:.75rem;border-radius:6px}
.flt .fsr{display:flex;align-items:center}.flt .fsr input{display:block;padding-left:30px}
.flt .fsr .ic{position:absolute;top:50%;transform:translateY(-50%);left:9px;font-size:14px;color:var(--ink-soft);pointer-events:none}
[hidden]{display:none!important}
.srch{display:flex;gap:8px}
.srch label{position:relative;flex:1;min-width:0}
.srch .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);pointer-events:none}
input,select{font:inherit;font-size:.875rem;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;color:var(--ink)}
.srch input{padding-left:36px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.875rem;font-weight:600;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--grey)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.primary:hover{background:var(--red-dark)}
.btn.s{padding:4px 9px;font-size:.75rem}
.btn .ic{font-size:16px}
.fields{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:768px){.fields{grid-template-columns:repeat(4,minmax(0,1fr))}}
.fields label{display:block;font-size:.6875rem;font-weight:500;color:var(--ink-soft)}
.fields select,.fields input{margin-top:2px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.meta .chipx{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--grey);border-radius:999px;padding:2px 8px;font-size:.6875rem;font-weight:500}
.meta .chipx:hover{border-color:var(--red);color:var(--red-ink)}
.meta .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:16px;font-size:.875rem}
.pager .btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:32px;text-align:center}
.empty b{display:block;font-size:1.0625rem}.empty p{margin-top:4px;color:var(--ink-soft);font-size:.875rem}

/* charts */
.donut{display:flex;flex-direction:column;align-items:center;gap:16px}
.donut-svg{position:relative;width:192px;height:192px}
.donut-svg svg{width:100%;height:100%}
.donut-svg a:hover circle{opacity:.8}
.donut-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-mid b{font-size:1.875rem;line-height:1}.donut-mid span{margin-top:4px;font-size:.75rem;color:var(--ink-soft)}
.legend{width:100%}.legend li+li{margin-top:2px}
.legend a{display:flex;align-items:center;gap:8px;border-radius:6px;padding:4px 8px;font-size:.875rem}
.legend a:hover{background:var(--grey)}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend .n{font-weight:600}.legend .pct{width:40px;text-align:right;font-size:.75rem;color:var(--ink-soft)}
.legend .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbars li+li{margin-top:8px}
.rbars a{display:grid;grid-template-columns:140px 1fr 28px;align-items:center;gap:8px;border-radius:6px;padding:2px 0;font-size:.75rem}
.rbars a:hover{background:var(--grey)}
.rbars .l{color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbars .tr{display:block;height:16px}.rbars .bar{display:block;height:100%;border-radius:0 4px 4px 0;min-width:3px}
.rbars .n{font-weight:600;color:var(--ink)}
.cols{display:flex;align-items:flex-end;gap:12px;height:240px;padding-top:20px}
.cols a{flex:1;max-width:72px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;border-radius:6px}
.cols a:hover{background:var(--grey)}
.cols .bar{display:block;width:100%;border-radius:4px 4px 0 0}
.cols b{font-size:.8125rem}.cols span.l{font-size:.75rem;color:var(--ink-soft);white-space:nowrap}
.tiles{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.tile{display:flex;align-items:center;gap:12px;min-width:112px;border:1px solid var(--line);border-left-width:4px;border-radius:8px;background:var(--surface);padding:8px 12px}
.tile:hover{border-color:rgb(90 97 105/.5);box-shadow:var(--shadow)}
.tile b{font-size:1.5rem;line-height:1}.tile span{font-size:.75rem;font-weight:500;color:var(--ink-soft);line-height:1.2}
.note{margin-top:4px;font-size:.75rem;color:var(--ink-soft)}

/* calendar */
.cal{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:.875rem}
.cal th{background:var(--grey);border-bottom:1px solid var(--line);padding:8px 0;text-align:center;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft)}
.cal td{vertical-align:top;height:96px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal tr td:last-child{border-right:0}.cal tr:last-child td{border-bottom:0}
.cal td.out{background:var(--grey);color:var(--ink-soft)}
.cal td.we{background:var(--wk)}
.cal .dn{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:999px;font-size:.75rem;font-weight:600}
.cal td.today .dn{background:var(--red);color:#fff}
.cal .ev{display:block;margin-top:2px;border-left:3px solid;border-radius:3px;background:var(--grey);padding:1px 5px;font-size:.6875rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev:hover{background:var(--hover2)}
.cal .moreday{display:block;margin-top:2px;font-size:.6875rem;font-weight:600;color:var(--red-ink)}
.cal-key{display:flex;flex-wrap:wrap;gap:4px 16px;margin-bottom:12px;font-size:.75rem;color:var(--ink-soft)}
.cal-key li{display:inline-flex;align-items:center;gap:6px}.cal-key i{width:10px;height:10px;border-radius:2px}
@media(max-width:767px){.cal td{height:64px}.cal .ev{display:none}}

/* theme button and list view */
.ibtn{padding:8px 10px}.ibtn .ic{font-size:18px}
.ibtn .th-sun{display:none}html[data-theme=dark] .ibtn .th-sun{display:inline}html[data-theme=dark] .ibtn .th-moon{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px}
.seg a{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:5px 10px;font-size:.75rem;font-weight:600}
.seg a:hover{background:var(--grey)}
.seg a[aria-current=true]{background:var(--red);color:#fff}
.seg .ic{font-size:14px}
.ptw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.ptable{width:100%;min-width:880px;border-collapse:collapse;font-size:.875rem}
.ptable th{background:var(--grey);padding:10px 16px;text-align:left;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}
.ptable th a{display:inline-flex;align-items:center;gap:4px}.ptable th a:hover{color:var(--red-ink)}
.ptable th[aria-sort=ascending] a,.ptable th[aria-sort=descending] a{color:var(--ink)}
.ptable td{padding:12px 16px;vertical-align:top;border-top:1px solid var(--line)}
.ptable tbody tr{cursor:pointer}.ptable tbody tr:hover{background:var(--grey)}
.ptable td.nm{max-width:260px;font-weight:600}.ptable tr:hover td.nm a{color:var(--red-ink)}
.ptable td.up{max-width:340px;color:var(--ink-soft)}
/* dialog and actions */
.ph-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dlg{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgb(41 45 50/.5);padding:16px}
.dlg[hidden]{display:none}
.dlg-box{background:var(--surface);border-radius:12px;box-shadow:0 20px 50px rgb(0 0 0/.3);width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:24px}
.dlg-box h2{font-size:1.125rem;font-weight:700;display:flex;align-items:center;gap:8px}
.dlg-box h2 .ic{font-size:22px}
.dlg-box .ok{color:var(--ok)}.dlg-box .bad{color:var(--err)}
.dlg-box p{margin-top:8px;font-size:.875rem;color:var(--ink-soft)}
.dlg-box ul.notes{margin:8px 0 0 18px;list-style:disc;font-size:.8125rem;color:var(--ink-soft)}
.dlg-box .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.dlg-box .stat{border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.75rem;color:var(--ink-soft)}
.dlg-box .stat b{display:block;font-size:1.25rem;color:var(--ink);line-height:1.2}
.dlg-box .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.dlg-box form input{margin-top:12px}
.dlg-box ul.hist{list-style:none;margin-top:12px;display:grid;gap:6px}
.dlg-box ul.hist li{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.8125rem;color:var(--ink-soft)}
.dlg-box ul.hist b{color:var(--ink)}
.dlg-box .loading{padding:24px;color:var(--ink-soft)}
.dlg-box summary{cursor:pointer;margin-top:12px;font-size:.875rem;font-weight:600}
@media(max-width:639px){#import-btn{padding:8px 10px}}
/* gantt */
.gscroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.ginner{min-width:880px}
.grow{display:flex;border-top:1px solid var(--line)}
.grow:hover{background:var(--grey)}
.glab{position:sticky;left:0;z-index:3;flex:none;width:240px;background:var(--surface);padding:8px 12px;border-right:1px solid var(--line)}
.grow:hover .glab{background:var(--grey)}
.glab b{display:block;font-size:.875rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow:hover .glab b{color:var(--red-ink)}
.glab span{display:block;font-size:.75rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glab span.err{color:var(--err);font-weight:600}
.gtrack{position:relative;flex:1;height:56px}
.ghead{display:flex;background:var(--grey);font-size:.75rem;font-weight:600;color:var(--ink-soft)}
.ghead .glab{background:var(--grey);display:flex;align-items:center}
.ghead .gtrack{height:40px}
.gm{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding:2px 0 0 8px}
.gline{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:1}
.gchip{position:absolute;bottom:2px;transform:translateX(-50%);background:var(--red);color:#fff;border-radius:4px;padding:0 6px;font-size:.625rem;line-height:16px}
.gbar{position:absolute;top:50%;height:14px;transform:translateY(-50%);border-radius:7px;opacity:.85}
.gdia{position:absolute;top:50%;z-index:2;width:14px;height:14px;transform:translate(-50%,-50%) rotate(45deg);border:2px solid var(--surface)}
.gmile{position:absolute;top:50%;z-index:2;width:10px;height:10px;transform:translate(-50%,-50%);border-radius:50%;background:var(--surface);border:2px solid var(--ink-soft)}
.cal-key .dia{width:10px;height:10px;background:var(--ink);transform:rotate(45deg);border-radius:0}
.cal-key .dot{width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--ink-soft)}

/* detail */
.back{display:inline-flex;align-items:center;gap:4px;font-size:.875rem;font-weight:500;color:var(--ink-soft)}
.back:hover{color:var(--red-ink)}
.dh h1{margin-top:8px;font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.dh .row{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{display:block;margin-bottom:-1px;border-bottom:2px solid transparent;padding:10px 12px;font-size:.875rem;font-weight:500;color:var(--ink-soft);white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current=page]{border-color:var(--red);color:var(--red-ink)}
.facts{display:grid;gap:16px 24px;grid-template-columns:minmax(0,1fr)}
@media(min-width:640px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1024px){.facts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.facts dt{font-size:.75rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft)}
.facts dd{margin-top:4px;font-size:.875rem}
.prewrap{white-space:pre-line;font-size:.875rem}
.olist li{display:flex;gap:12px;padding:12px 16px}.olist li+li{border-top:1px solid var(--line)}
.olist .n{display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin-top:2px;border-radius:50%;background:var(--grey);font-size:.75rem;font-weight:600;color:var(--ink-soft);flex:none}
.tbl{overflow-x:auto}
.tbl table{width:100%;min-width:560px;border-collapse:collapse;font-size:.875rem}
.tbl th{background:var(--grey);border-bottom:1px solid var(--line);padding:8px 16px;text-align:left;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft)}
.tbl td{border-bottom:1px solid var(--line);padding:10px 16px}
.help{max-width:672px;margin:0 auto;padding:32px;text-align:center}
.help .big{margin:0 auto;display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:var(--red-tint);color:var(--red-ink);font-size:28px}
</style>
</head>

function buildMonth(ym) {
  const y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) - 1;
  const byDay = {};
  P.forEach((p) => { if (p.effectiveDate) (byDay[p.effectiveDate] = byDay[p.effectiveDate] || []).push(p); });
  const lead = (new Date(Date.UTC(y, m, 1)).getUTCDay() + 6) % 7;
  const dim = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  const cells = Math.ceil((lead + dim) / 7) * 7;
  const weeks = []; let total = 0;
  for (let i = 0; i < cells; i++) {
    const d = new Date(Date.UTC(y, m, 1 - lead + i));
    const iso = d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0");
    const inMonth = d.getUTCMonth() === m;
    const list = (byDay[iso] || []).slice().sort((a, b) => a.name.localeCompare(b.name));
    if (inMonth) total += list.length;
    if (i % 7 === 0) weeks.push([]);
    weeks[weeks.length - 1].push({ iso, day: d.getUTCDate(), inMonth, today: iso === D.meta.today, we: (d.getUTCDay() + 6) % 7 >= 5, list });
  }
  return { weeks, total };
}

    shell();
    if (location.hash && location.hash !== "#/") location.hash = "#/"; else render();
    const stat = (n, l) => '<div class="stat"><b>' + n + "</b>" + l + "</div>";
    openDialog('<h2 class="ok">' + ic("check") + "Dashboard updated</h2><p>" + esc(file.name) + " is loaded: " + plural(next.projects.length, "project") + ' read from the sheet "' + esc(res.source.sheetName) + '". Every card and chart now shows it.</p>' +
      '<div class="stats">' + stat(diff.added, "new") + stat(diff.changed, "changed") + stat(diff.same, "unchanged") + stat(diff.removed, "no longer in the file") + "</div>" +
      (diff.removed ? "<p>Projects that are not in this file are no longer shown (this page shows exactly the file you import).</p>" : "") +
      (kept ? "<p>Remembered in this browser, so it is still here next time you open this file. Use the &ldquo;Go back&rdquo; link at the bottom of the page to undo.</p>" : "<p><b>Note:</b> this browser would not let the page remember the import, so it will be lost when you close the page.</p>") +
      (res.notes.length ? "<details><summary>Notes about this file (" + res.notes.length + ')</summary><ul class="notes">' + res.notes.map((n) => "<li>" + esc(n) + "</li>").join("") + "</ul></details>" : "") +
      '<p><b>This is a preview in this browser only.</b> Publish it to update the dashboard for everyone.</p><div class="acts"><button class="btn primary" type="button" id="publish-now" data-focus>' + ic("upload") + 'Publish for everyone</button><button class="btn" type="button" data-close>Done</button><a class="btn" href="#/projects" data-close>View all projects</a></div>');
  } catch (e) {
    openDialog('<h2 class="bad">' + ic("xcircle") + "Nothing was changed</h2><p>" + esc(friendly(e)) + "</p>" + '<p>The dashboard still shows what it showed before. The file needs a sheet with a project name, an expected date and a current-status column (a Status column is optional).</p><div class="acts"><button class="btn primary" type="button" data-close data-focus>Close</button></div>');
  }
}
/* ---------- publishing: sign in with the shared passphrase, publish, history and restore ----------
   The browser only ever holds a short-lived HttpOnly cookie (which scripts cannot read) and a per-session CSRF token.
   Blob tokens, the passphrase and the signing secret live on the server and are never sent here. */
async function api(path, opts) {
  try {
    const r = await fetch(path, Object.assign({ credentials: "same-origin", cache: "no-store" }, opts));
    let j = null; try { j = await r.json(); } catch (e) { /* no body */ }
    return { ok: r.ok, status: r.status, json: j || {} };
  } catch (e) { return { ok: false, status: 0, json: { message: "Could not reach the server. Check your connection and try again." } }; }
}
const postJson = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json", "X-CSRF-Token": auth ? auth.csrf : "" }, body: JSON.stringify(body) });
async function checkAuth() {
  const r = await api("/api/auth");
  auth = r.ok && r.json.authenticated ? { csrf: r.json.csrfToken } : null;
  return { configured: r.status !== 503 && r.status !== 404 && r.status !== 0, signedIn: !!auth };
}
const msgDialog = (cls, icon, title, body, extra) => openDialog('<h2 class="' + cls + '">' + ic(icon) + esc(title) + "</h2><p>" + esc(body) + "</p>" + (extra || "") + '<div class="acts"><button class="btn primary" type="button" data-close data-focus>Close</button></div>');
let afterLogin = null;
function loginDialog(next, note) {
  afterLogin = next;
  openDialog("<h2>Publisher sign-in</h2><p>Enter the publishing passphrase to continue. Viewing the dashboard never needs one.</p>" + (note ? '<p class="bad">' + esc(note) + "</p>" : "") +
    '<form id="pub-form" autocomplete="off"><input type="password" id="pub-pass" name="passphrase" autocomplete="current-password" aria-label="Publishing passphrase" required data-focus>' +
    '<div class="acts"><button class="btn primary" type="submit">Sign in</button><button class="btn" type="button" data-close>Cancel</button></div></form>');
}
async function submitLogin(form) {
  const input = form.querySelector("#pub-pass"), passphrase = input.value;
  input.value = ""; // never keep the passphrase in the page
  const r = await postJson("/api/auth", { passphrase });
  if (r.ok && r.json.authenticated) { auth = { csrf: r.json.csrfToken }; const n = afterLogin; afterLogin = null; if (n) n(); else closeDialog(); return; }
  const msg = r.status === 401 ? "That passphrase is not correct." : r.status === 429 ? "Too many failed attempts. Please wait a few minutes and try again." : r.status === 503 ? "Publishing is not set up on this deployment." : (r.json.message || "Could not sign in.");
  loginDialog(afterLogin, msg);
}
async function startPublish(force) {
  if (!pending) { msgDialog("bad", "xcircle", "Nothing to publish", "Import an Excel file first, then publish it."); return; }
  openDialog('<h2>Publishing...</h2><p class="loading">Checking your sign-in.</p>');
  const st = await checkAuth();
  if (!st.configured) { msgDialog("bad", "xcircle", "Publishing is not available", "Publishing is not set up on this deployment (or this page is not being served from the dashboard site). Your preview is unchanged."); return; }
  if (!st.signedIn) { loginDialog(() => startPublish(force)); return; }
  openDialog('<h2>Publishing...</h2><p class="loading">Sending ' + plural(pending.source.projects.length, "project") + " to the dashboard.</p>");
  const body = { action: "publish", source: pending.source };
  if (!force) body.baseVersion = published ? published.version : null;
  const r = await postJson("/api/publish", body);
  if (r.ok && r.json.ok) {
    published = { version: r.json.version, publishedAt: r.json.publishedAt, source: pending.source };
    pending = null;
    try { localStorage.removeItem(STORE); } catch (e) { /* ignore */ }
    loadInitial(); shell(); render();
    openDialog('<h2 class="ok">' + ic("check") + "Published</h2><p>" + plural(r.json.projectCount, "project") + " from " + esc(r.json.fileName) + " are now live for everyone. Viewers see them the next time they open or refresh the dashboard (within about 10 seconds).</p><p>Published " + esc(fmtStamp(r.json.publishedAt)) + '.</p><div class="acts"><button class="btn primary" type="button" data-close data-focus>Done</button></div>');
  } else if (r.status === 401 || r.json.error === "bad_csrf") {
    auth = null; loginDialog(() => startPublish(force), "Your sign-in expired. Please sign in again.");
  } else if (r.status === 409) {
    msgDialog("bad", "xcircle", "Newer data exists", r.json.message || "The published data changed.");
    document.querySelector("#dlg-content .acts").insertAdjacentHTML("afterbegin", '<button class="btn" type="button" id="pub-anyway">Publish anyway</button>');
  } else {
    msgDialog("bad", "xcircle", "Nothing was published", r.json.message || "Something went wrong. Please try again.");
  }
}
async function openTools() {
  openDialog('<h2>Publisher tools</h2><p class="loading">Loading...</p>');
  const st = await checkAuth();
  if (!st.configured) { msgDialog("bad", "xcircle", "Publishing is not available", "Publishing is not set up on this deployment (or this page is not being served from the dashboard site)."); return; }
  if (!st.signedIn) { loginDialog(openTools); return; }
  const r = await api("/api/publish");
  if (r.status === 401) { auth = null; loginDialog(openTools, "Your sign-in expired. Please sign in again."); return; }
  if (!r.ok) { msgDialog("bad", "xcircle", "Could not load history", r.json.message || "Please try again."); return; }
  const cur = r.json.current, rows = r.json.history || [];
  const what = (h) => (h.action === "rollback" ? "Restored version" : esc(h.fileName)) + " &middot; " + plural(h.projectCount, "project");
  openDialog("<h2>Publisher tools</h2>" + (cur ? "<p>Live now: " + what(cur) + ", published " + esc(fmtStamp(cur.publishedAt)) + ".</p>" : "<p>Nothing has been published yet. Import an Excel file, then choose Publish.</p>") +
    (rows.length ? "<p>Recent versions. Restoring one publishes it again for everyone and is itself recorded, so you can undo it.</p>" : "") +
    '<ul class="hist">' + rows.map((h) => "<li><span><b>" + esc(fmtStamp(h.publishedAt)) + "</b><br>" + what(h) + "</span>" +
      (cur && h.version === cur.version ? '<span class="tag">Live</span>' : '<button class="btn s" type="button" data-restore="' + esc(h.version) + '" data-base="' + esc(cur ? cur.version : "") + '">Restore</button>') + "</li>").join("") + "</ul>" +
    '<div class="acts"><button class="btn primary" type="button" data-close data-focus>Done</button><button class="btn" type="button" id="pub-signout">Sign out</button></div>');
}
async function restoreVersion(version, base) {
  openDialog('<h2>Restoring...</h2><p class="loading">Publishing the earlier version again.</p>');
  const r = await postJson("/api/publish", { action: "rollback", version, baseVersion: base || null });
  if (r.ok && r.json.ok) {
    const p = await fetchPublished(r.json.version);
    if (p) { published = p; loadInitial(); shell(); render(); }
    openTools();
  } else if (r.status === 401 || r.json.error === "bad_csrf") { auth = null; loginDialog(openTools, "Your sign-in expired. Please sign in again."); }
  else msgDialog("bad", "xcircle", "Nothing was changed", r.json.message || "Could not restore that version.");
}
document.getElementById("import-btn").addEventListener("click", () => document.getElementById("import-file").click());
document.getElementById("import-file").addEventListener("change", (e) => { const f = e.target.files[0]; e.target.value = ""; doImport(f); });

document.addEventListener("click", (e) => {
  const sv = e.target.closest && e.target.closest("[data-view]");
  if (sv) { try { localStorage.setItem(VIEW_KEY, sv.getAttribute("data-view")); } catch (x) { /* ignore */ } }
  const tr = e.target.closest && e.target.closest("tr[data-href]");
  if (tr && !e.target.closest("a")) { location.hash = tr.getAttribute("data-href"); return; }
  const t = e.target.closest && e.target.closest("#more");
  if (t) { const open = t.getAttribute("aria-expanded") !== "true"; moreOpen = open; document.getElementById("more-options").hidden = !open; t.setAttribute("aria-expanded", String(open)); t.textContent = open ? "Fewer options" : "More options"; return; }
  const rs = e.target.closest && e.target.closest("[data-restore]");
  if (rs) { restoreVersion(rs.getAttribute("data-restore"), rs.getAttribute("data-base")); return; }
  const c = e.target.closest && e.target.closest("[id]");
  const id = c && c.id;
  if (id === "dl-all") downloadProjects(sortProjects(P, "date", "asc"), "All projects");
  else if (id === "dl-filtered") downloadProjects(window.__filtered || [], describeFilters());
  else if (id === "publish-now") startPublish(false);
  else if (id === "pub-anyway") startPublish(true);
  else if (id === "pub-tools") { e.preventDefault(); openTools(); }
  else if (id === "pub-signout") { api("/api/auth", { method: "DELETE" }).then(() => { auth = null; closeDialog(); }); }
  else if (id === "reset") { e.preventDefault(); try { localStorage.removeItem(STORE); } catch (x) { /* ignore */ } loadInitial(); shell(); location.hash = "#/"; render(); }
});

/* First paint waits (up to 4 s) for the published data; the built-in data is the fallback. */
loadInitial();
document.getElementById("view").innerHTML = '<p class="loading" role="status" style="padding:24px;color:var(--ink-soft)">Loading the latest data...</p>';
fetchPublished().then((p) => { if (p) published = p; loadInitial(); ready = true; shell(); render(); });
/* A tab left open picks up a newer publish when it becomes visible again (checked at most once a minute). */
let lastCheck = Date.now();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !ready || Date.now() - lastCheck < 60000) return;
  lastCheck = Date.now();
  fetchPublished(String(lastCheck)).then((p) => { if (p && (!published || p.version !== published.version)) { published = p; loadInitial(); shell(); render(); } });
});
})();
</script>
</body>
</html>
